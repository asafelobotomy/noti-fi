[package]
name = "notify-cli"
description = "noti-fi command line (`notify`): install, run and control the notifd notification daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "notify"
path = "src/main.rs"

[dependencies]
notify-client = { path = "../notify-client" }
notify-protocol = { path = "../notify-protocol" }
notify-update = { path = "../notify-update" }
notify-jobs = { path = "../notify-jobs" }
notify-bus = { path = "../notify-bus" }
notify-panel-core = { path = "../notify-panel-core" }   # rules.json editing and the safe save, shared with the panel (`notify set`)
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
regress = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = "0.41"   # links the system libsqlite3 (qt6-base already needs it)

[dev-dependencies]
notify-testkit = { path = "../notify-testkit" }
notify-client = { path = "../notify-client" }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
