name: release

# Push a tag like v0.7.0 to build the binaries and publish a GitHub release with the archive and its checksum.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (for example v0.7.0); it must already exist'
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Install build tools and Qt
        run: pacman -Syu --noconfirm --needed base-devel git rust qt6-base qt6-declarative python kirigami qqc2-desktop-style quickshell labwc dbus libnotify sqlite
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Check the tag matches the version in the code
        id: v
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          want="${TAG#v}"
          have=$(cargo metadata --no-deps --format-version 1 | python -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [ "$want" != "$have" ]; then echo "tag $TAG does not match the crate version $have: bump Cargo.toml (and daemonVersion in notifd/shell.qml) first" >&2; exit 1; fi
          echo "version=$have" >> "$GITHUB_OUTPUT"
      - name: Test the parts that need no desktop
        run: |
          cargo test --locked -p notify-protocol -p notify-apps -p notify-panel-core -p notify-jobs --lib
          cargo test --locked -p notify-cli --test loc --test version --test qml
          cargo test --locked -p notify-jobs --test bridge
      - name: Build release binaries
        run: cargo build --release --locked -p notify-cli -p notify-panel
      - name: Daemon, sound, CLI, client and panel tests (headless Wayland)
        run: tests/ci-daemon.sh
      - name: Package
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: packaging/build-tarball.sh "$VERSION" target
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: noti-fi-${{ steps.v.outputs.version }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: noti-fi-${{ needs.build.outputs.version }}
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          cd dist
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "noti-fi $TAG" --generate-notes \
            --notes "Install: extract the archive and run ./install.sh (into ~/.local), then notify takeover --dry-run. Runtime needs: quickshell, qt6-declarative, kirigami, qqc2-desktop-style. Verify with the .sha256 file." \
            ./*.tar.gz ./*.sha256
