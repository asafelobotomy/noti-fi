name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: archlinux:latest        # Manjaro/Arch is the target; Qt 6 and cxx-qt build against its libraries
    steps:
      - name: Install build tools and Qt
        run: |
          # quickshell, labwc, dbus and libnotify run the daemon suites headless; kirigami and qqc2-desktop-style are for the panel and its QML tests
          pacman -Syu --noconfirm --needed base-devel git rust qt6-base qt6-declarative python kirigami qqc2-desktop-style quickshell labwc dbus libnotify sqlite
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-${{ hashFiles('Cargo.lock') }}
          restore-keys: ci-
      - name: Build everything
        run: cargo build --workspace --locked
      - name: Unit tests and the project's own rules (line limit, version agreement)
        run: |
          cargo test --locked -p notify-protocol -p notify-apps -p notify-panel-core -p notify-jobs --lib
          cargo test --locked -p notify-cli --test loc --test version --test qml
      - name: Job bridge on a private D-Bus
        run: cargo test --locked -p notify-jobs --test bridge
      - name: Daemon, sound, CLI, client and panel tests (headless Wayland)
        run: tests/ci-daemon.sh
      - name: Clippy (reported, not blocking)
        run: cargo clippy --workspace --all-targets --locked || true

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
