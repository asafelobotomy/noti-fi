name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: input
    id: version
    attributes: {label: Version, description: Output of `notify --version`}
    validations: {required: true}
  - type: textarea
    id: what
    attributes: {label: What happened, description: And what you expected}
    validations: {required: true}
  - type: textarea
    id: doctor
    attributes: {label: Output of `notify doctor`, render: text}
