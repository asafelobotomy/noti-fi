name: release

# Push a tag like v0.7.0 to build the binaries and publish a GitHub release with the archive and its checksum.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (for example v0.7.0); it must already exist'
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Install build tools and Qt
        run: pacman -Syu --noconfirm --needed base-devel git rust qt6-base qt6-declarative python kirigami qqc2-desktop-style quickshell labwc dbus libnotify sqlite
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Check the tag matches the version in the code
        id: v
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          want="${TAG#v}"
          have=$(cargo metadata --no-deps --format-version 1 | python -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [ "$want" != "$have" ]; then echo "tag $TAG does not match the crate version $have: bump Cargo.toml (and daemonVersion in notifd/shell.qml) first" >&2; exit 1; fi
          echo "version=$have" >> "$GITHUB_OUTPUT"
      - name: Test the parts that need no desktop
        run: |
          cargo test --locked -p notify-protocol -p notify-apps -p notify-panel-core -p notify-jobs -p notify-update -p notify-bus --lib
          cargo test --locked -p notify-cli --test loc --test version --test qml --test lifecycle
          cargo test --locked -p notify-jobs --test bridge
      - name: Build release binaries
        run: cargo build --release --locked -p notify-cli -p notify-panel
      - name: Daemon, sound, CLI, client and panel tests (headless Wayland)
        run: tests/ci-daemon.sh
      - name: Package
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: packaging/build-tarball.sh "$VERSION" target
      # The source archive the AUR package builds from, so its checksum is
      # fixed by this release rather than by GitHub's generated archives.
      - name: Source archive and AUR files
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          src="noti-fi-$VERSION.tar.gz"
          git archive --format=tar.gz --prefix="noti-fi-$VERSION/" -o "dist/$src" HEAD
          ( cd dist && sha256sum "$src" > "$src.sha256" )
          sum=$(cut -d' ' -f1 "dist/$src.sha256")
          mkdir -p aur/noti-fi
          sed "s/^sha256sums=('SKIP')$/sha256sums=('$sum')/" packaging/PKGBUILD > aur/noti-fi/PKGBUILD
          grep -q "^sha256sums=('$sum')$" aur/noti-fi/PKGBUILD
          grep -q "^pkgver=$VERSION$" aur/noti-fi/PKGBUILD || { echo "pkgver in packaging/PKGBUILD is not $VERSION" >&2; exit 1; }
          useradd -m aurbuild
          chown -R aurbuild aur
          su aurbuild -c 'cd aur/noti-fi && makepkg --printsrcinfo > .SRCINFO'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aur
          path: aur/
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: noti-fi-${{ steps.v.outputs.version }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: noti-fi-${{ needs.build.outputs.version }}
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          cd dist
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "noti-fi $TAG" --generate-notes \
            --notes "Install: extract the archive and run ./install.sh (into ~/.local), then notify takeover --dry-run. Runtime needs: quickshell, qt6-declarative, kirigami, qqc2-desktop-style, dbus, pipewire, python. Verify with the .sha256 file." \
            ./*.tar.gz ./*.sha256
