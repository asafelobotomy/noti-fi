[workspace]
members = ["crates/notify-protocol", "crates/notify-client", "crates/notify-testkit", "crates/notify-cli", "crates/notify-panel", "crates/notify-panel-core", "crates/notify-apps", "crates/notify-update", "crates/notify-panel-smoke", "crates/notify-jobs", "crates/notify-bus"]
resolver = "3"

[workspace.package]
version = "0.18.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
anyhow = "1"

[profile.release]
strip = true
